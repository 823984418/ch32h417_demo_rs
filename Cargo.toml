[package]
name = "ch32h417_demo_rs"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ch32h417_demo_rs"
harness = false

[profile.dev]
debug = true

[profile.release]
debug = true

[dependencies]

[dependencies.rtt-target]
version = "0.6.2"

[dependencies.embedded-alloc]
version = "0.7.0"
default-features = false
features = [
    "llff",
]

[dependencies.riscv]
version = "0.16.1"
features = [
    "critical-section-single-hart",
]

[dependencies.libc]
version = "0.2.189"

[dependencies.cortex-m-std-dummy]
version = "0.2.0"
features = [
    "all",
    "linkage_weak",
    "nightly_linkage",
]

[dependencies.riscv-rt]
version = "0.18.0"
features = [
    "memory",
    "custom-interrupts",
]

[dependencies.rpb]
path = "../rpb"
features = ["ch32h417"]

[dependencies.embedded-hal]
version = "1.0.0"

[lints.rust]
nonstandard_style = "allow"
