[package]
name = "ch32h417_demo_rs"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ch32h417_demo_rs"
harness = false

[profile.dev]
debug = true

[profile.release]
debug = true

[dependencies]

[dependencies.rtt-target]
version = "0.6.2"

[dependencies.riscv]
version = "0.16.1"
features = [
    "rt",
    "critical-section-single-hart",
]

[dependencies.cortex-m-std-dummy]
version = "0.2.0"
features = [
    "all",
    "linkage_weak",
    "nightly_linkage",
]

[dependencies.riscv-rt]
version = "0.18.0"
features = [
    "memory",
]
