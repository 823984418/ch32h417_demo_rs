[build]
target = [
    "riscv32imafc-unknown-none-elf.json",
]

[target."cfg(all())"]
rustflags = [
    "-Clink-arg=--nmagic",
    "-Clink-arg=-Tlink.x",
]

[unstable]
json-target-spec = true
panic-immediate-abort = true
build-std = [
    "core",
    "alloc",
    "panic_abort",
    "std",
]
build-std-features = [
    "optimize_for_size",
]
